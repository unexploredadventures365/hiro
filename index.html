    const data = { name, industry: $('#cInd', w).value.trim(), spocName: $('#cSpoc', w).value.trim(), spocEmail: email, spocPhone: $('#cPhone', w).value.trim(),
      feePercent: num($('#cFee', w).value), guaranteeDays: Math.round(num($('#cGuar', w).value)), creditDays: Math.round(num($('#cCred', w).value)) };
    if (id) Object.assign(cl, data); else S.clients.push({ id: uid('cli'), ...data });
    logActivity(`${firstName(me.name)} ${id ? 'updated' : 'added'} the client ${name}`);
    save(); closeModal(); render(); toast(id ? 'Client saved.' : `${name} added.`, 'success');
  };
}

/* =================== placements =================== */
function renderPlacements(){
  const t0 = startOfToday();
  const rows = accessibleCandidates().filter(c => stageType(c.stage) === 'joined').map(c => {
    const f = feeFor(c);
    return { c, f, due: c.joiningDate ? addDaysDate(c.joiningDate, f.client ? f.client.creditDays : 0) : null, gEnd: c.joiningDate ? addDaysDate(c.joiningDate, f.client ? f.client.guaranteeDays : 0) : null };
  }).sort((a, b) => new Date(b.c.joiningDate || b.c.updatedAt) - new Date(a.c.joiningDate || a.c.updatedAt));
  const sum = fn => rows.filter(fn).reduce((s, r) => s + r.f.amount, 0);
  const overdue = rows.filter(r => r.c.invoiceStatus === 'raised' && r.due && r.due < t0);
  const inGuarantee = rows.filter(r => r.gEnd && r.gEnd >= t0);
  const kpis = [
    ['Total fees', inr(sum(() => true)), `${rows.length} placement${rows.length === 1 ? '' : 's'}`],
    ['Collected', inr(sum(r => r.c.invoiceStatus === 'paid')), `${rows.filter(r => r.c.invoiceStatus === 'paid').length} paid`],
    ['To collect', inr(sum(r => r.c.invoiceStatus !== 'paid')), `${rows.filter(r => r.c.invoiceStatus === 'pending').length} invoice${rows.filter(r => r.c.invoiceStatus === 'pending').length === 1 ? '' : 's'} not raised`],
    ['Overdue', inr(overdue.reduce((s, r) => s + r.f.amount, 0)), `${overdue.length} past payment terms`],
    ['In guarantee', inGuarantee.length, 'Could still need a replacement']
  ];
  $('#view').innerHTML = pageHead('Placements', 'Candidates who joined, what to invoice, and when each guarantee ends.')
    + `<section class="kpi-strip">${kpis.map(k => `<div class="kpi"><div class="kpi-label">${k[0]}</div><div class="kpi-value">${esc(k[1])}</div><div class="kpi-foot">${esc(k[2])}</div></div>`).join('')}</section>`
    + (rows.length ? `<div class="table-wrap"><table class="table"><thead><tr><th>Candidate</th><th>Client and role</th><th>Joined</th><th class="num">Final CTC</th><th class="num">Fee</th><th>Payment due</th><th>Guarantee</th><th>Invoice</th></tr></thead><tbody>
      ${rows.map(r => {
        const c = r.c, late = c.invoiceStatus === 'raised' && r.due && r.due < t0;
        const g = !r.gEnd ? '<span class="muted">Needs joining date</span>' : r.gEnd >= t0 ? `<span class="badge b-warn">Until ${fmtShort(r.gEnd)}</span>` : '<span class="badge b-good">Completed</span>';
        return `<tr>
          <td><button class="btn-text" style="padding:0;font-weight:600;color:var(--ink);cursor:pointer;background:none;border:0" data-act="open-cand" data-id="${esc(c.id)}">${esc(c.name)}</button></td>
          <td>${esc(r.f.client ? r.f.client.name : 'No client')}<span class="cell-sub">${esc(r.f.job ? r.f.job.title : '')}</span></td>
          <td>${c.joiningDate ? fmtDate(c.joiningDate) : `<button class="btn btn-ghost btn-sm" data-act="open-cand" data-id="${esc(c.id)}">Add date</button>`}</td>
          <td class="num">${lpa(r.f.ctc)}${!c.offeredCTC && c.expectedCTC ? '<span class="cell-sub">Using expected</span>' : ''}</td>
          <td class="num"><b>${inr(r.f.amount)}</b><span class="cell-sub">${r.f.pct}%</span></td>
          <td>${r.due ? `${fmtDate(r.due)}${late ? ' <span class="badge b-bad">Overdue</span>' : ''}` : '—'}</td>
          <td>${g}</td>
          <td>${isAdmin() ? `<label class="sr-only" for="inv-${esc(c.id)}">Invoice status</label><select class="select select-inline" id="inv-${esc(c.id)}" data-inv="${esc(c.id)}">${Object.entries(INVOICE).map(([k, l]) => `<option value="${k}"${k === c.invoiceStatus ? ' selected' : ''}>${l}</option>`).join('')}</select>` : `<span class="badge ${c.invoiceStatus === 'paid' ? 'b-good' : c.invoiceStatus === 'raised' ? 'b-brand' : 'b-muted'}">${INVOICE[c.invoiceStatus]}</span>`}</td>
        </tr>`; }).join('')}</tbody></table></div>`
      : emptyState('No placements yet', 'When you move a candidate to a “Joined” stage, they show up here with their fee, payment date and guarantee period.'));
  $$('[data-inv]').forEach(s => s.onchange = () => {
    const c = candById(s.dataset.inv); c.invoiceStatus = s.value; c.updatedAt = nowISO();
    logActivity(`${firstName(me.name)} marked ${c.name}’s invoice as ${INVOICE[s.value].toLowerCase()}`, c.jobId);
    save(); render(); toast(`Invoice marked as ${INVOICE[s.value].toLowerCase()}.`, 'success');
  });
}

/* =================== team =================== */
ACTIONS['new-user'] = () => openUserForm(null);
ACTIONS['edit-user'] = id => openUserForm(id);
ACTIONS['del-user'] = async id => {
  const u = userById(id); if (!u || u.id === me.id) return;
  if (u.role === 'admin' && !S.users.some(x => x.id !== id && x.role === 'admin' && x.active)) { toast('Hiro needs at least one admin.', 'error'); return; }
  if (!(await confirmDialog(`Remove ${u.name}? They won’t be able to sign in. Candidates they added stay in the pipeline.`, { ok:'Remove' }))) return;
  S.users = S.users.filter(x => x.id !== id);
  S.jobs.forEach(j => { j.assignedRecruiterIds = j.assignedRecruiterIds.filter(x => x !== id); });
  logActivity(`${firstName(me.name)} removed ${u.name} from the team`);
  save(); render(); toast(`${u.name} removed.`);
};
function renderTeam(){
  const tag = (on, label) => `<span class="badge ${on ? 'b-good' : 'b-muted'}">${on ? icon('check',11) : icon('lock',11)} ${label}</span>`;
  $('#view').innerHTML = pageHead('Team', 'Who can sign in, which mandates they see, and what they’re allowed to do.', `<button class="btn btn-primary" data-act="new-user">${icon('plus')}Add team member</button>`)
    + `<div class="table-wrap"><table class="table"><thead><tr><th>Member</th><th>Role</th><th>Mandates</th><th>Permissions</th><th>Status</th><th></th></tr></thead><tbody>
      ${S.users.map(u => {
        const jobs = u.role === 'admin' ? null : S.jobs.filter(j => j.assignedRecruiterIds.includes(u.id));
        const admin = u.role === 'admin';
        return `<tr>
          <td><div class="who"><span class="avatar">${esc(initials(u.name))}</span><div><b>${esc(u.name)}${u.id === me.id ? ' <span class="muted">(you)</span>' : ''}</b><span class="cell-sub">${esc(u.email || '')}</span></div></div></td>
          <td><span class="badge ${admin ? 'b-brand' : 'b-muted'}">${admin ? 'Admin' : 'Recruiter'}</span></td>
          <td>${admin ? '<span class="muted">All mandates</span>' : jobs.length ? esc(jobs.map(j => j.title).join(', ')) : '<span class="muted">None assigned</span>'}</td>
          <td><div class="perm">${tag(admin || u.canDownloadCV, 'Contacts and CVs')}${tag(admin || u.canExportCSV, 'Export')}${tag(admin || u.canViewCommercials, 'Fees')}</div></td>
          <td><span class="badge ${u.active ? 'b-good' : 'b-muted'}">${u.active ? 'Active' : 'Disabled'}</span></td>
          <td class="actions"><button class="icon-btn sm" data-act="edit-user" data-id="${esc(u.id)}" aria-label="Edit ${esc(u.name)}" title="Edit">${icon('edit',15)}</button>${u.id !== me.id ? `<button class="icon-btn sm" data-act="del-user" data-id="${esc(u.id)}" aria-label="Remove ${esc(u.name)}" title="Remove">${icon('trash',15)}</button>` : ''}</td>
        </tr>`; }).join('')}</tbody></table></div>`;
}
function openUserForm(id){
  if (!isAdmin()) return;
  const editing = id ? userById(id) : null;
  const u = editing || { id: uid('user'), name:'', email:'', role:'recruiter', canDownloadCV:false, canExportCSV:false, canViewCommercials:false, active:true };
  const self = editing && editing.id === me.id;
  const perm = (k, title, sub) => `<label class="check"><input type="checkbox" class="uPerm" id="${k}"${u[k] ? ' checked' : ''}><div><b>${title}</b><small>${sub}</small></div></label>`;
  const body = `
    <div class="form-grid">
      <label class="field"><span>Full name</span><input class="input" id="uName" value="${esc(u.name)}"></label>
      <label class="field"><span>Email <i class="opt">optional</i></span><input class="input" id="uEmail" type="email" value="${esc(u.email)}"></label>
      <label class="field"><span>Role</span><select class="select" id="uRole"><option value="recruiter"${u.role === 'recruiter' ? ' selected' : ''}>Recruiter</option><option value="admin"${u.role === 'admin' ? ' selected' : ''}>Admin</option></select></label>
      <label class="field"><span>${editing ? 'New PIN' : 'PIN'}</span><input class="input pin" id="uPin" inputmode="numeric" maxlength="6" placeholder="${editing ? 'Keep current' : '4 to 6 digits'}" autocomplete="new-password"></label>
    </div>
    <div class="field" id="uPerms"><span>Permissions</span><div class="check-list" style="max-height:none">
      ${perm('canDownloadCV', 'See contact details and download CVs', 'Without this, phone numbers and emails are masked.')}
      ${perm('canExportCSV', 'Export candidates to CSV', 'Downloads the pipeline as a spreadsheet.')}
      ${perm('canViewCommercials', 'See clients, fees and placements', 'Shows the Clients and Placements pages.')}
    </div></div>
    <div class="field" id="uJobsField"><span>Mandates</span>${S.jobs.length ? `<div class="check-list">${S.jobs.map(j => `<label class="check"><input type="checkbox" class="uJob" value="${esc(j.id)}"${j.assignedRecruiterIds.includes(u.id) ? ' checked' : ''}><div><b>${esc(j.title)}</b><small>${esc((clientById(j.clientId) || {}).name || '')}</small></div></label>`).join('')}</div>` : '<small class="help">No mandates yet.</small>'}</div>
    <p class="help" id="uAdminNote">Admins can see and change everything, so permissions and mandates don’t apply.</p>
    ${!self ? `<label class="check"><input type="checkbox" id="uActive"${u.active ? ' checked' : ''}><div><b>Can sign in</b><small>Turn off to block access without deleting the account.</small></div></label>` : ''}
    <p class="form-error" id="uError" role="alert"></p>`;
  const w = openModal({ title: editing ? `Edit ${u.name}` : 'Add team member', size:'md', body,
    footer:`<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="uSave">${editing ? 'Save changes' : 'Add member'}</button>` });
  const syncRole = () => { const admin = $('#uRole', w).value === 'admin'; $('#uPerms', w).hidden = admin; $('#uJobsField', w).hidden = admin; $('#uAdminNote', w).hidden = !admin; };
  $('#uRole', w).onchange = syncRole; syncRole();
  $('#uSave', w).onclick = async () => {
    const err = m => { $('#uError', w).textContent = m; };
    const name = $('#uName', w).value.trim(), email = $('#uEmail', w).value.trim(), role = $('#uRole', w).value, pin = $('#uPin', w).value.trim();
    const active = $('#uActive', w) ? $('#uActive', w).checked : true;
    if (!name) return err('Enter a name.');
    if (email && !EMAIL_FULL.test(email)) return err('That email doesn’t look right.');
    if (!editing && !pin) return err('Set a PIN they’ll use to sign in.');
    if (pin && !/^\d{4,6}$/.test(pin)) return err('The PIN must be 4 to 6 digits.');
    if (editing && editing.role === 'admin' && (role !== 'admin' || !active) && !S.users.some(x => x.id !== u.id && x.role === 'admin' && x.active)) return err('Hiro needs at least one active admin. Make someone else an admin first.');
    Object.assign(u, { name, email, role, active, canDownloadCV: $('#canDownloadCV', w).checked, canExportCSV: $('#canExportCSV', w).checked, canViewCommercials: $('#canViewCommercials', w).checked });
    if (pin) { u.pinHash = await hashPin(u.id, pin); if (role === 'admin') S.meta.pinChanged = true; }
    const checked = role === 'admin' ? [] : $$('.uJob:checked', w).map(x => x.value);
    S.jobs.forEach(j => { const has = j.assignedRecruiterIds.includes(u.id), want = checked.includes(j.id); if (want && !has) j.assignedRecruiterIds.push(u.id); if (!want && has) j.assignedRecruiterIds = j.assignedRecruiterIds.filter(x => x !== u.id); });
    if (!editing) S.users.push(u);
    logActivity(`${firstName(me.name)} ${editing ? 'updated' : 'added'} ${name}${pin && editing ? ' and reset their PIN' : ''}`);
    save(); closeModal();
    if (self) { $('#meName').textContent = u.name; $('#meAvatar').textContent = initials(u.name); $('#meRole').textContent = u.role === 'admin' ? 'Admin' : 'Recruiter'; }
    go(view); toast(editing ? 'Changes saved.' : `${name} can now sign in.`, 'success');
  };
}

  const a = S.aiConfig;
  $('#view').innerHTML = pageHead('Settings', 'AI scoring and your data.') + `<div class="settings-grid">
    <section class="panel">
      <div class="panel-head"><div><h2>AI CV scoring</h2><p class="page-sub">With a key, each uploaded CV is read by AI for name, contact details, salary, notice period and fit. Without one, Hiro matches skills and experience.</p></div><span class="badge ${a.apiKey ? 'b-good' : 'b-muted'}">${a.apiKey ? 'On' : 'Off'}</span></div>
      <div class="panel-body">
        <div class="form-grid">
          <label class="field"><span>Provider</span><select class="select" id="aiProvider">${Object.entries(AI_NAMES).map(([k, l]) => `<option value="${k}"${k === a.provider ? ' selected' : ''}>${l}</option>`).join('')}</select></label>
          <label class="field"><span>Model</span><input class="input" id="aiModel" value="${esc(a.model)}" spellcheck="false"></label>
          <label class="field span-2"><span>Endpoint</span><input class="input" id="aiEndpoint" value="${esc(a.endpoint)}" spellcheck="false"></label>
          <label class="field span-2"><span>API key</span><div class="with-btn"><input class="input" id="aiKey" type="password" value="${esc(a.apiKey)}" placeholder="Paste your key" spellcheck="false" autocomplete="off"><button class="btn btn-text btn-sm" type="button" data-act="toggle-key">Show</button></div></label>
        </div>
        <div class="alert warn" style="margin-top:14px">${icon('alert',16)}<span>The key is saved in this browser and sent straight to the provider from here. Use a key with a monthly spending limit.</span></div>
        <div class="row-actions"><button class="btn btn-primary" data-act="ai-save">Save</button><button class="btn btn-ghost" data-act="ai-test">Test connection</button><span id="aiResult" class="ai-result" role="status"></span></div>
      </div>
    </section>
    <section class="panel">
      <div class="panel-head"><div><h2>Data and backups</h2><p class="page-sub">Everything is saved in this browser on this device. Download a backup regularly, and use it to move your data to another computer.</p></div></div>
      <div class="panel-body">
        <div class="row-actions" style="margin-top:0"><button class="btn btn-ghost" data-act="export-backup">${icon('download',16)}Download backup</button><button class="btn btn-ghost" data-act="import-backup">${icon('upload',16)}Restore from backup</button><span class="spacer" style="flex:1"></span><button class="btn btn-text danger" data-act="reset-data">Reset to demo data</button></div>
        <p class="help" style="margin:12px 0 0">Backups include clients, mandates, candidates, notes and team members. CV files and the AI key aren’t included.</p>
      </div>
    </section></div>`;
  $('#aiProvider').onchange = e => { const p = AI_PRESETS[e.target.value]; $('#aiModel').value = p.model; $('#aiEndpoint').value = p.endpoint; };
}
const readAiForm = () => ({ provider: $('#aiProvider').value, model: $('#aiModel').value.trim(), endpoint: $('#aiEndpoint').value.trim(), apiKey: $('#aiKey').value.trim() });
ACTIONS['toggle-key'] = (id, el) => { const k = $('#aiKey'); k.type = k.type === 'password' ? 'text' : 'password'; el.textContent = k.type === 'password' ? 'Show' : 'Hide'; };
ACTIONS['ai-save'] = () => { const cfg = readAiForm(); if (cfg.apiKey && !cfg.model) { toast('Enter a model name.', 'error'); return; } S.aiConfig = cfg; save(); render(); toast(cfg.apiKey ? 'AI settings saved.' : 'AI scoring turned off.', 'success'); };
ACTIONS['ai-test'] = async () => {
  const cfg = readAiForm(), out = $('#aiResult');
  if (!cfg.apiKey) { out.className = 'ai-result bad'; out.textContent = 'Paste an API key first.'; return; }
  out.className = 'ai-result'; out.textContent = 'Testing…';
  try { const r = parseJSONLoose(await aiComplete('Reply with only this JSON and nothing else: {"ok": true}', cfg)); if (!r || r.ok !== true) throw new Error('Unexpected reply'); out.className = 'ai-result ok'; out.textContent = `Connected to ${cfg.model}. Remember to save.`; }
  catch (e) { out.className = 'ai-result bad'; out.textContent = `Didn’t work: ${e.message}`; }
};
ACTIONS['export-backup'] = () => {
  downloadBlob(new Blob([JSON.stringify({ ...S, aiConfig: { ...S.aiConfig, apiKey:'' } }, null, 2)], { type:'application/json' }), `hiro-backup-${new Date().toISOString().slice(0, 10)}.json`);
  toast('Backup downloaded.', 'success');
};
ACTIONS['import-backup'] = () => {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    let data;
    try { data = JSON.parse(await f.text()); if (!data || !Array.isArray(data.users) || !Array.isArray(data.jobs)) throw new Error(); }
    catch (e) { toast('That file isn’t a Hiro backup.', 'error'); return; }
    if (!(await confirmDialog('Replace everything in this browser with this backup? CV files already stored here are kept.', { ok:'Replace data' }))) return;
    const key = S.aiConfig.apiKey;
    S = normalizeState(data); if (!S.aiConfig.apiKey) S.aiConfig.apiKey = key;
    await secureUsers(); save();
    const u = me && userById(me.id);
    if (u && u.active) { me = u; go(view); toast('Backup restored.', 'success'); }
    else { sessionStorage.removeItem('hiro_session'); showLogin(); toast('Backup restored. Sign in again.', 'success'); }
  };
  inp.click();
};
ACTIONS['reset-data'] = async () => {
  if (!(await confirmDialog('Delete every client, mandate, candidate and CV in this browser and load the demo data? Download a backup first if you need it.', { ok:'Reset everything' }))) return;
  try { await CVDB.clear(); } catch (e) {}
  S = normalizeState(makeDefaultState()); await secureUsers(); save();
  sessionStorage.removeItem('hiro_session'); showLogin(); toast('Demo data loaded. The admin PIN is 1234.', 'success');
};

/* =================== theme & init =================== */
function effectiveTheme(){ return document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); }
function paintThemeBtn(){ $('#themeBtn').innerHTML = icon(effectiveTheme() === 'dark' ? 'sun' : 'moon'); }
function applyTheme(t){ if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; paintThemeBtn(); }

window.addEventListener('storage', e => {
  if (e.key !== STORE_KEY) return;
  S = loadState();
  if (!me) return;
  const u = userById(me.id);
  if (!u || !u.active) { logout(); return; }
  me = u; renderNav(); if (!modalStack.length) render();
});

(async function init(){
  try { applyTheme(localStorage.getItem('hiro_theme')); } catch (e) { applyTheme(null); }
  await secureUsers();
  $('#loginForm').addEventListener('submit', submitLogin);
  $('#lockBtn').innerHTML = icon('logout');
  $('#lockBtn').onclick = logout;
  $('#themeBtn').onclick = () => { const next = effectiveTheme() === 'dark' ? 'light' : 'dark'; localStorage.setItem('hiro_theme', next); applyTheme(next); render(); };
  const sid = sessionStorage.getItem('hiro_session'), u = sid && userById(sid);
  if (u && u.active) enterApp(u); else showLogin();
})();
</script>
</body>
</html>
