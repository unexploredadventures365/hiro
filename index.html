async function removeCvFiles(cands){
  const paths = cands.filter(c => !c.talentId).map(c => c.cvPath).filter(Boolean); // the CV database keeps shared files
  for (let i = 0; i < paths.length; i += 100) { const { error } = await sb.storage.from(CV_BUCKET).remove(paths.slice(i, i + 100)); if (error) console.warn('cv cleanup', error); }
}
ACTIONS['del-job'] = async id => {
  const j = jobById(id); if (!j) return;
  const cands = S.candidates.filter(c => c.jobId === id);
  if (!(await confirmDialog(`Delete “${j.title}”${cands.length ? ` and its ${cands.length} candidate${cands.length > 1 ? 's' : ''}` : ''}? This can’t be undone.`))) return;
  try { await removeCvFiles(cands); await db(sb.from('jobs').delete().eq('id', id), 'delete the mandate'); }
  catch (e) { toast(e.message, 'error'); return; }
  logActivity(`${firstName(me.name)} deleted the mandate ${j.title}`);
  await refreshNow(); toast('Mandate deleted.');
};
function renderJobs(){
  const jobs = accessibleJobs();
  const counts = { open: jobs.filter(j => j.status === 'open').length, hold: jobs.filter(j => j.status === 'hold').length, closed: jobs.filter(j => j.status === 'closed').length, all: jobs.length };
  const list = jobFilter === 'all' ? jobs : jobs.filter(j => j.status === jobFilter);
  const seg = [['open','Open'],['hold','On hold'],['closed','Closed'],['all','All']].map(([k, l]) => `<button class="${jobFilter === k ? 'on' : ''}" data-act="job-filter" data-id="${k}">${l}<em>${counts[k]}</em></button>`).join('');
  $('#view').innerHTML = pageHead('Mandates', isAdmin() ? 'Each mandate has its own pipeline and assigned recruiters.' : 'The mandates you’re working on.',
      isAdmin() ? `<button class="btn btn-primary" data-act="new-job">${icon('plus')}New mandate</button>` : '')
    + (jobs.length ? `<div class="seg" role="group" aria-label="Filter by status">${seg}</div>` : '')
    + (list.length ? `<div class="job-grid">${list.map(jobCard).join('')}</div>`
      : jobs.length ? emptyBlock('Nothing here', 'No mandates with this status.')
      : isAdmin() ? emptyBlock('No mandates yet', 'Add a client, then create a mandate for the role they want filled.', `<button class="btn btn-primary" data-act="new-job">${icon('plus')}New mandate</button>`)
      : emptyBlock('No mandates assigned', 'Ask your admin to add you to a mandate.'));
}
function jobCard(j){
  const cands = S.candidates.filter(c => c.jobId === j.id);
  const client = clientById(j.clientId);
  const joined = cands.filter(c => stageType(c.stage) === 'joined').length;
  const days = Math.max(0, Math.floor((Date.now() - new Date(j.createdAt)) / 864e5));
  const recs = j.assignedRecruiterIds.map(userById).filter(Boolean);
  const status = { open:['b-good','Open'], hold:['b-warn','On hold'], closed:['b-muted','Closed'] }[j.status] || ['b-muted', j.status];
  const bar = S.stages.map(st => { const n = cands.filter(c => c.stage === st.id).length; return n ? `<i style="flex:${n};background:${STAGE_COLORS[st.color]}" title="${esc(st.label)}: ${n}"></i>` : ''; }).join('');
  return `<article class="job">
    <div class="job-top"><div style="min-width:0"><div class="client">${esc(client ? client.name : 'No client')}</div><h3>${esc(j.title)}</h3></div><span class="badge ${status[0]}">${status[1]}</span></div>

function renderPlacements(){
  const t0 = startOfToday();
  const rows = accessibleCandidates().filter(c => stageType(c.stage) === 'joined').map(c => {
    const f = feeFor(c), p = c.placement;
    return { c, f, p, due: p && p.payment_due_date ? new Date(p.payment_due_date) : null, gEnd: p && p.guarantee_end_date ? new Date(p.guarantee_end_date) : null };
  }).sort((a, b) => new Date(b.c.joiningDate || b.c.updatedAt) - new Date(a.c.joiningDate || a.c.updatedAt));
  const sum = fn => rows.filter(fn).reduce((s, r) => s + r.f.amount, 0);
  const overdue = rows.filter(r => r.c.invoiceStatus === 'raised' && r.due && r.due < t0);
  const inGuarantee = rows.filter(r => r.gEnd && r.gEnd >= t0);
  const notRaised = rows.filter(r => r.c.invoiceStatus === 'pending').length;
  const kpis = [
    ['Total fees', inr(sum(() => true)), `${rows.length} placement${rows.length === 1 ? '' : 's'}`],
    ['Collected', inr(sum(r => r.c.invoiceStatus === 'paid')), `${rows.filter(r => r.c.invoiceStatus === 'paid').length} paid`],
    ['To collect', inr(sum(r => r.c.invoiceStatus !== 'paid')), `${notRaised} invoice${notRaised === 1 ? '' : 's'} not raised`],
    ['Overdue', inr(overdue.reduce((s, r) => s + r.f.amount, 0)), `${overdue.length} past payment terms`],
    ['In guarantee', inGuarantee.length, 'Could still need a replacement']
  ];
  $('#view').innerHTML = pageHead('Placements', 'Candidates who joined, what to invoice, and when each guarantee ends.')
    + `<section class="kpi-strip">${kpis.map(k => `<div class="kpi"><div class="kpi-label">${k[0]}</div><div class="kpi-value">${esc(k[1])}</div><div class="kpi-foot">${esc(k[2])}</div></div>`).join('')}</section>`
    + (rows.length ? `<div class="table-wrap"><table class="table"><thead><tr><th>Candidate</th><th>Client and role</th><th>Joined</th><th class="num">Final CTC</th><th class="num">Fee</th><th>Payment due</th><th>Guarantee</th><th>Invoice</th></tr></thead><tbody>
      ${rows.map(r => {
        const c = r.c, late = c.invoiceStatus === 'raised' && r.due && r.due < t0;
        const g = !r.gEnd ? '<span class="muted">Needs joining date</span>' : r.gEnd >= t0 ? `<span class="badge b-warn">Until ${fmtShort(r.gEnd)}</span>` : '<span class="badge b-good">Completed</span>';
        return `<tr>
          <td><button style="padding:0;font-weight:600;color:var(--ink);cursor:pointer;background:none;border:0;text-align:left" data-act="open-cand" data-id="${esc(c.id)}">${esc(c.name)}</button></td>
          <td>${esc(r.f.client ? r.f.client.name : 'No client')}<span class="cell-sub">${esc(r.f.job ? r.f.job.title : '')}</span></td>
          <td>${c.joiningDate ? fmtDate(c.joiningDate) : `<button class="btn btn-ghost btn-sm" data-act="open-cand" data-id="${esc(c.id)}">Add date</button>`}</td>
          <td class="num">${lpa(r.f.ctc)}${r.p && r.p.using_expected_ctc ? '<span class="cell-sub">Using expected</span>' : ''}</td>
          <td class="num"><b>${inr(r.f.amount)}</b><span class="cell-sub">${r.f.pct}%</span></td>
          <td>${r.due ? `${fmtDate(r.due)}${late ? ' <span class="badge b-bad">Overdue</span>' : ''}` : '—'}</td>
          <td>${g}</td>
          <td>${isAdmin() && r.p ? `<label class="sr-only" for="inv-${esc(c.id)}">Invoice status</label><select class="select select-inline" id="inv-${esc(c.id)}" data-inv="${esc(c.id)}">${Object.entries(INVOICE).map(([k, l]) => `<option value="${k}"${k === c.invoiceStatus ? ' selected' : ''}>${l}</option>`).join('')}</select>` : `<span class="badge ${c.invoiceStatus === 'paid' ? 'b-good' : c.invoiceStatus === 'raised' ? 'b-brand' : 'b-muted'}">${INVOICE[c.invoiceStatus]}</span>`}</td>
        </tr>`; }).join('')}</tbody></table></div>`
      : emptyBlock('No placements yet', 'When you move a candidate to a “Joined” stage, they show up here with their fee, payment date and guarantee period.'));
  $$('[data-inv]').forEach(s => s.onchange = async () => {
    const c = candById(s.dataset.inv), v = s.value;
    const patch = { invoice_status: v };
    if (v === 'raised' && !(c.placement && c.placement.invoiced_on)) patch.invoiced_on = todayISO();
    if (v === 'paid') { patch.paid_on = todayISO(); if (!(c.placement && c.placement.invoiced_on)) patch.invoiced_on = todayISO(); }
    if (v === 'pending') { patch.invoiced_on = null; patch.paid_on = null; }
    s.disabled = true;
    try { await db(sb.from('placements').update(patch).eq('candidate_id', c.id), 'update the invoice'); }
    catch (e) { toast(e.message, 'error'); s.value = c.invoiceStatus; s.disabled = false; return; }
    logActivity(`${firstName(me.name)} marked ${c.name}’s invoice as ${INVOICE[v].toLowerCase()}`, c.jobId);
    await refreshNow(); toast(`Invoice marked as ${INVOICE[v].toLowerCase()}.`, 'success');
  });
}

      ${perm('canSearch', 'Use the CV database and create leads', 'Shows every saved CV profile. Contact details still need the first permission.')}
    </div></div>
    <div class="field" id="uJobsField"><span>Mandates</span>${S.jobs.length ? `<div class="check-list">${S.jobs.map(j => `<label class="check"><input type="checkbox" class="uJob" value="${esc(j.id)}"${j.assignedRecruiterIds.includes(u.id) ? ' checked' : ''}><div><b>${esc(j.title)}</b><small>${esc((clientById(j.clientId) || {}).name || '')}</small></div></label>`).join('')}</div>` : '<small class="help">No mandates yet.</small>'}</div>
    <p class="help" id="uAdminNote" style="margin:0">Admins can see and change everything, so permissions and mandates don’t apply.</p>
    <p class="form-error" id="uError" role="alert"></p>`;
  const w = openModal({ title: u.active ? `Edit ${u.name}` : `Switch on ${u.name}`, subtitle: u.active ? '' : esc('Signed up and waiting for access.'), size:'md', body,
    footer:`<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="uSave">${u.active ? 'Save changes' : 'Switch on'}</button>` });
  const syncRole = () => { const admin = $('#uRole', w).value === 'admin'; $('#uPerms', w).hidden = admin; $('#uJobsField', w).hidden = admin; $('#uAdminNote', w).hidden = !admin; };
  $('#uRole', w).onchange = syncRole; syncRole();
  $('#uSave', w).onclick = () => busy($('#uSave', w), 'Saving…', async () => {
    const name = $('#uName', w).value.trim(), role = $('#uRole', w).value;
    const active = $('#uActive', w) ? $('#uActive', w).checked : true;
    if (!name) throw new Error('Enter a name.');
    await db(sb.from('agency_users').update({ full_name: name, role, is_active: active,
      can_download_cv: $('#canDownloadCV', w).checked, can_export_csv: $('#canExportCSV', w).checked, can_view_commercials: $('#canViewCommercials', w).checked, can_search_database: $('#canSearch', w).checked }).eq('id', u.id), 'save this team member');
    const wanted = role === 'admin' ? [] : $$('.uJob:checked', w).map(x => x.value);
    const current = S.jobs.filter(j => j.assignedRecruiterIds.includes(u.id)).map(j => j.id);
    const toAdd = wanted.filter(x => !current.includes(x)), toRemove = current.filter(x => !wanted.includes(x));
    if (toRemove.length) await db(sb.from('job_recruiters').delete().eq('user_id', u.id).in('job_id', toRemove), 'update mandates');
    if (toAdd.length) await db(sb.from('job_recruiters').insert(toAdd.map(j => ({ job_id: j, user_id: u.id }))), 'update mandates');
    logActivity(`${firstName(me.name)} ${u.active ? 'updated' : 'switched on'} ${name}`);
    w._busy = false; closeModal(); await refreshNow();
    if (self) { $('#meName').textContent = me.name; $('#meAvatar').textContent = initials(me.name); $('#meRole').textContent = me.role === 'admin' ? 'Admin' : 'Recruiter'; go(view); }
    toast(u.active ? 'Changes saved.' : `${name} can now sign in.`, 'success');
  }, $('#uError', w));
}

/* =================== settings =================== */
function renderSettings(){
  const st = { ok:['b-good','Working'], missing:['b-warn','Not set up'], unknown:['b-muted','Not checked'] }[aiState] || ['b-muted','Not checked'];
  $('#view').innerHTML = pageHead('Settings', 'AI scoring and your data.') + `<div class="settings-grid">
    <section class="panel">
      <div class="panel-head"><div style="display:flex;gap:12px;align-items:flex-start"><span class="tile">${icon('spark',18)}</span><div><h2>AI CV scoring</h2><p class="page-sub">AI reads each CV for role, experience, salary, notice period and fit, and picks its folder in the CV database. It runs inside your Supabase project, so the key never reaches anyone’s browser. Contact details are removed before CV text is sent.</p></div></div><span class="badge ${st[0]}" id="aiBadge">${st[1]}</span></div>
      <div class="panel-body">
        <div class="row-actions" style="margin-top:0"><button class="btn btn-primary" data-act="ai-test">Test AI scoring</button><span class="muted">Takes a few seconds. You’ll see each step.</span></div>
        <ul class="steps-status" id="aiSteps" aria-live="polite"></ul>
        <details style="margin-top:16px"><summary style="cursor:pointer;font-weight:600">Setup and speed</summary>
          <ol class="steps" style="margin-top:12px">
            <li>In Supabase, open <b>Edge Functions</b> and open (or create) the function named <span class="code">score-cv</span>. Replace its code with <span class="code">score-cv-function.ts</span> and deploy.</li>
            <li>In <b>Edge Functions → Secrets</b>, set <span class="code">AI_API_KEY</span> and <span class="code">AI_PROVIDER</span> (<span class="code">gemini</span>).</li>
            <li>For the fastest scoring, set <span class="code">AI_MODEL</span> to <span class="code">gemini-3.5-flash-lite</span>.</li>
          </ol>
        </details>
      </div>
    </section>
    <section class="panel">
      <div class="panel-head"><div><h2>Your data</h2><p class="page-sub">Everything is saved in your Supabase database and shared live with your team. Supabase keeps its own backups; you can also download a copy here.</p></div><span class="badge b-good"><span class="sync-dot" style="margin:0"></span> Connected</span></div>
      <div class="panel-body">
        <div class="row-actions" style="margin-top:0"><button class="btn btn-ghost" data-act="export-backup">${icon('download',16)}Download a copy</button></div>
        <p class="help" style="margin:12px 0 0">The copy includes clients, mandates and candidates as a JSON file. Contact details are included only if you can see them. CV files stay in Supabase storage.</p>
      </div>
    </section></div>`;
}
ACTIONS['ai-test'] = async (id, el) => {
  const out = $('#aiSteps'); if (!out) return;
  const line = (cls, text) => `<li class="${cls}">${cls === 'ok' ? icon('check',15) : cls === 'bad' ? icon('x',15) : cls === 'tip' ? icon('info',15) : '<span class="spin-sm"></span>'}<span>${text}</span></li>`;
  const setBadge = ok => { const b = $('#aiBadge'); if (b) { b.className = 'badge ' + (ok ? 'b-good' : 'b-warn'); b.textContent = ok ? 'Working' : 'Not working'; } };
  el.disabled = true;
  let done = '';
  out.innerHTML = line('wait', 'Connecting to the score-cv function…');
  try {
    let ping;
    try { ping = await invokeAi({ ping: true }, 15000); }
    catch (e) {
      const old = /empty or too long/i.test(e.message);
      out.innerHTML = line('bad', old ? 'Your score-cv function is the older version. In Supabase, replace its code with the new score-cv-function.ts and deploy, then test again.' : `Couldn’t reach the score-cv function: ${esc(e.message)}`);
      setBadge(false); return;
    }
    done = line('ok', `Function connected (${esc(ping.provider)}, model ${esc(ping.model)}).`);
    if (!ping.keySet) { aiState = 'missing'; out.innerHTML = done + line('bad', 'The AI_API_KEY secret is missing. Add it in Edge Functions → Secrets.'); setBadge(false); return; }
    const t0 = Date.now();
    out.innerHTML = done + line('wait', `Asking ${esc(ping.model)} a test question… <b id="aiTimer">0s</b>`);
    const timer = setInterval(() => { const t = $('#aiTimer'); if (t) t.textContent = Math.round((Date.now() - t0) / 1000) + 's'; }, 500);
    try {
      const r = await aiComplete('Reply with only this JSON and nothing else: {"ok": true}');
      const j = parseJSONLoose(r.text); if (!j || j.ok !== true) throw new Error('Unexpected reply from the AI');
      const secs = ((Date.now() - t0) / 1000).toFixed(1);
      done += line('ok', `The AI replied in ${secs}s. CV scoring is working.`);
      if (secs > 6) done += line('tip', `That’s on the slow side. For faster uploads, set the AI_MODEL secret to gemini-3.5-flash-lite.`);
      out.innerHTML = done; setBadge(true);
    } catch (e) {
      out.innerHTML = done + line('bad', `The AI didn’t answer: ${esc(e.message)}`) + (/model/i.test(e.message) ? line('tip', 'Change the AI_MODEL secret to a current model, such as gemini-3.5-flash-lite.') : '');
      setBadge(false);
    } finally { clearInterval(timer); }
  } finally { el.disabled = false; }
};
ACTIONS['export-backup'] = () => {
  const data = { exportedAt: nowISO(), stages: S.stages, clients: S.clients.filter(c => c.full), jobs: S.jobs, candidates: S.candidates.map(({ placement, ...c }) => c), team: S.users.map(({ id, name, email, role, active }) => ({ id, name, email, role, active })) };
  downloadBlob(new Blob([JSON.stringify(data, null, 2)], { type:'application/json' }), `hiro-export-${todayISO()}.json`);
  logActivity(`${firstName(me.name)} downloaded a data export`);
  toast('Copy downloaded.', 'success');
};

/* =================== theme & start-up =================== */
function effectiveTheme(){ return document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); }
function applyTheme(t){ if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; $('#themeBtn').innerHTML = icon(effectiveTheme() === 'dark' ? 'sun' : 'moon'); }

(async function init(){
  try { applyTheme(localStorage.getItem('hiro_theme')); } catch (e) { applyTheme(null); }
  $('#lockBtn').innerHTML = icon('logout'); $('#lockBtn').onclick = logout;
  $('#passBtn').innerHTML = icon('key'); $('#passBtn').onclick = () => openPasswordModal(false);
  $('#themeBtn').onclick = () => { const next = effectiveTheme() === 'dark' ? 'light' : 'dark'; try { localStorage.setItem('hiro_theme', next); } catch (e) {} applyTheme(next); render(); };
  if (!sb) { $('#bootText').textContent = 'Couldn’t load the database connection. Check your internet connection and reload the page.'; $('.spinner').remove(); return; }
  $('#authForm').addEventListener('submit', submitAuth);
  $('#toggleMode').onclick = () => setAuthMode(authMode === 'signin' ? 'signup' : 'signin');
  $('#forgotBtn').onclick = () => setAuthMode('reset');
  $('#pendingOut').onclick = logout;
  $('#pendingRetry').onclick = async () => { const { data } = await sb.auth.getUser(); if (data && data.user) startSession(data.user); else showAuth(); };
  let recovering = false;
  sb.auth.onAuthStateChange(event => {
    if (event === 'PASSWORD_RECOVERY') { recovering = true; setTimeout(() => openPasswordModal(true), 300); }
  });
  const { data: { session } } = await sb.auth.getSession();
  if (session) await startSession(session.user);
  else showAuth();
  if (recovering && !modalStack.length) openPasswordModal(true);
})();
</script>
